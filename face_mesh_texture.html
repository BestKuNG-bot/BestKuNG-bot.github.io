<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mesh Texture</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('visible-face-mesh', {
      init: function () {
        const arSystem = this.el.sceneEl.systems['mindar-face-system'];
        arSystem.registerFaceMesh(this);
        this.el.object3D.matrixAutoUpdate = false;
      },

      updateVisibility: function (visible) {
        this.el.object3D.visible = visible;
      },

      updateMatrix: function (matrix) {
        this.el.object3D.matrix.set(...matrix);
      },

      addFaceMesh: function (faceGeometry) {
        const material = new AFRAME.THREE.MeshBasicMaterial({
          color: 0x00ff00,
          transparent: true,
          opacity: 0.65,
          side: AFRAME.THREE.DoubleSide,
          depthTest: false,
          depthWrite: false
        });

        const mesh = new AFRAME.THREE.Mesh(faceGeometry, material);
        mesh.frustumCulled = false;
        mesh.renderOrder = 999;
        this.el.setObject3D('mesh', mesh);
        document.querySelector('#status').textContent = 'หันกล้องเข้าหาใบหน้า';
      }
    });
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
    #status {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 10; padding: 8px 14px; color: white;
      background: rgba(0, 0, 0, 0.55); border-radius: 20px;
      font-family: sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="status">กำลังเปิดกล้อง...</div>

  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-entity
      id="face"
      visible-face-mesh>
    </a-entity>

    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    scene.addEventListener('targetFound', () => {
      document.querySelector('#status').textContent = 'ตรวจพบใบหน้าแล้ว';
    });
    scene.addEventListener('targetLost', () => {
      document.querySelector('#status').textContent = 'ไม่พบใบหน้า';
    });
  </script>
</body>
</html>
