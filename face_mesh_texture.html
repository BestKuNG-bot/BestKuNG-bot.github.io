<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mesh Texture</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

<script>
  const face = document.querySelector('#face');

  function applyFaceTexture() {
    const mesh = face.getObject3D('mesh');

    // ถ้า Face Mesh ยังไม่พร้อม ให้รอก่อน
    if (!mesh) {
      setTimeout(applyFaceTexture, 200);
      return;
    }

    const texture = new AFRAME.THREE.TextureLoader().load(
      './memeface.png',
      function () {
        texture.colorSpace = AFRAME.THREE.SRGBColorSpace;

    mesh.material = new AFRAME.THREE.MeshBasicMaterial({
      color: 0xff0000,
      transparent: true,
      opacity: 0.6,
      side: AFRAME.THREE.DoubleSide
    });

        mesh.material.needsUpdate = true;
        mesh.frustumCulled = false;
      }
    );
  }

  document.querySelector('a-scene')
    .addEventListener('arReady', applyFaceTexture);
</script>
