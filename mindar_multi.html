<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>

<body>
<a-scene
  mindar-image="imageTargetSrc: ./mindar_multi.mind; maxTrack: 4; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
  
  vr-mode-ui="enabled: false"
  
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="model0" src="https://cream2429.github.io/animated_elephant_character.glb"></a-asset-item>
    <a-asset-item id="model1" src="https://kipop488.github.io/cat_rigged_animation_run.glb"></a-asset-item>
    <a-asset-item id="model2" src="https://kszamza222-design.github.io/sgp24_yoda_master.glb"></a-asset-item>
    <a-asset-item id="model3" src="https://bestkung-bot.github.io/rigged_dirty_bd-1_star_wars_jedi_fallen_order.glb"></a-asset-item>
  </a-assets>

  <!-- Target 1 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#model0" animation-mixer rotation="90 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
  </a-entity>

  <!-- Target 2 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#model1" animation-mixer rotation="90 0 0" scale="2 2 2"></a-gltf-model>
  </a-entity>

  <!-- Target 3 -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#model2" animation-mixer rotation="90 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
  </a-entity>

  <!-- Target 4 -->
  <a-entity mindar-image-target="targetIndex: 3">
    <a-gltf-model src="#model3" animation-mixer="clip: Idle; loop: repeat" position="0 -0.12 0.25" rotation="90 0 0" scale="0.08 0.08 0.08"></a-gltf-model>
  </a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

</a-scene>
</body>
</html>
