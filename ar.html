<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Image AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script>
    AFRAME.registerComponent('fit-model', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const box = new THREE.Box3().setFromObject(mesh);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const largestSide = Math.max(size.x, size.y, size.z);
          const scale = 0.9 / largestSide;
          this.el.object3D.scale.setScalar(scale);
          this.el.object3D.position.set(
            -center.x * scale,
            -center.y * scale,
            0.12 - center.z * scale
          );

          window.dispatchEvent(new CustomEvent('character-ready'));
        });
      }
    });
  </script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }
    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
    }
    .a-canvas {
      background: transparent !important;
    }
    #hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.68);
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">หันกล้องไปที่รูปแมว</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">
    <a-assets timeout="30000">
      <a-asset-item
        id="character"
        src="https://bestkung-bot.github.io/rigged_dirty_bd-1_star_wars_jedi_fallen_order.glb">
      </a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-ambient-light intensity="1.4"></a-ambient-light>
      <a-directional-light position="1 2 2" intensity="1.8"></a-directional-light>
      <a-gltf-model
        id="model"
        src="#character"
        position="0 0 0.12"
        rotation="90 0 0"
        scale="1 1 1"
        fit-model
        animation-mixer="clip: Idle; loop: repeat; clampWhenFinished: false">
      </a-gltf-model>
    </a-entity>
  </a-scene>
  <script>
    const hint = document.getElementById('hint');
    const target = document.getElementById('target');
    const model = document.getElementById('model');

    target.addEventListener('targetFound', () => {
      hint.textContent = 'พบรูปแล้ว';
      setTimeout(() => { hint.style.display = 'none'; }, 900);
    });
    target.addEventListener('targetLost', () => {
      hint.style.display = 'block';
      hint.textContent = 'หันกล้องกลับไปที่รูปแมว';
    });
    model.addEventListener('model-error', () => {
      hint.style.display = 'block';
      hint.textContent = 'โหลดโมเดลไม่สำเร็จ กรุณาลองเปิดใหม่';
    });
    window.addEventListener('character-ready', () => {
      hint.textContent = 'โมเดลพร้อมแล้ว หันกล้องไปที่รูปแมว';
    });
  </script>
</body>
</html>
